name: Build and deploy to Azure App Service

# Builds the Angular front end and the ASP.NET Core API into one package and,
# outside pull requests, deploys it to a single Azure App Service. The API
# serves the Angular files from wwwroot, so the browser calls /api on the same
# origin and no CORS or Netlify setup is needed.
#
# Setup steps are in docs/guides/DEPLOYMENT_AZURE.md. Until the repository
# variable AZURE_WEBAPP_NAME is set, only the build job runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: StudentApp/package-lock.json

      - name: Build Angular front end
        working-directory: StudentApp
        run: |
          npm ci --no-audit --no-fund
          npx ng build --configuration production

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish API
        run: dotnet publish StudentAssessmentTrackerAPI/StudentAssessmentTracker.csproj -c Release -o publish

      - name: Copy front end into the API's wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r StudentApp/dist/StudentApp/browser/. publish/wwwroot/
          test -f publish/wwwroot/index.html

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

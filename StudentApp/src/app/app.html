<!-- Navigation Bar -->
<nav class="navbar">
  <div class="navbar-content">
    <h1 class="app-title">📊 Student Assessment Tracker</h1>
    <div class="nav-buttons">

      <!-- Shown when nobody is logged in -->
      <ng-container *ngIf="!isAuthenticated && !isStudentAuthenticated">
        <button class="nav-btn" (click)="navigateToLogin()">Teacher Login</button>
        <button class="nav-btn" (click)="navigateToSignUp()">Teacher Sign Up</button>
        <button class="nav-btn student-btn" (click)="navigateToStudentLogin()">Student Login</button>
        <button class="nav-btn student-btn" (click)="navigateToStudentActivate()">Student Sign Up</button>
      </ng-container>

      <!-- Shown when teacher is logged in -->
      <ng-container *ngIf="isAuthenticated">
        <span class="nav-greeting" *ngIf="teacherName">Welcome, {{ teacherName }}</span>
        <button class="nav-btn" (click)="navigateToList()">View Students</button>
        <button class="nav-btn create-btn" (click)="navigateToCreate()">Add Student</button>
        <button class="nav-btn logout-btn" (click)="logout()">Logout</button>
      </ng-container>

      <!-- Shown when student is logged in (and teacher is NOT logged in) -->
      <ng-container *ngIf="isStudentAuthenticated && !isAuthenticated">
        <span class="nav-greeting" *ngIf="studentName">Welcome, {{ studentName }}</span>
        <button class="nav-btn" (click)="navigateToStudentDashboard()">My Dashboard</button>
        <button class="nav-btn logout-btn" (click)="studentLogout()">Logout</button>
      </ng-container>

    </div>
  </div>
</nav>

<!-- Main Content -->
<main class="main-content">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</main>

<!-- Footer -->
<footer class="footer">
  <p>&copy; 2026 Student Assessment Tracker | Full-Stack Angular + ASP.NET Core Application</p>
</footer>
